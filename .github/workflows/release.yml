# Сборка установщика для Windows.
# Тег вида v1.2.3 → собирается HoursTransfer-Setup.exe и публикуется в GitHub Releases.
# Ручной запуск (Actions → Run workflow) только собирает установщик и кладёт его в артефакты.
name: Установщик для Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.6,<7"

      - name: Сборка приложения
        run: >
          pyinstaller main.py --name HoursTransfer --windowed --noconfirm
          --icon assets/icon.ico --add-data "web;web"

      - name: Версия
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Установщик
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.value }} installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: HoursTransfer-Setup
          path: dist/installer/HoursTransfer-Setup.exe

      - name: Публикация в Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/HoursTransfer-Setup.exe
          generate_release_notes: true
